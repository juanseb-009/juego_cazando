<!DOCTYPE html>
<html>
<head>
  <title>Juego Cazando</title>
  <link rel="stylesheet" href="cazando.css">
  <script src="utils.js"></script>
</head>
<body onload="iniciar()">

  <h1>Juego Cazando</h1>
  <p>Autor: Sebas Santana</p>
  <canvas id="areaJuego" width="500" height="500"></canvas>



  <div class="controles">
    <button onclick="moverUp()">⬆</button>
    <br>
    <button onclick="moverIzq()">⬅</button>
    <button onclick="moverDown()">⬇</button>
    <button onclick="moverDere()">➡</button>
    <button onclick="reiniciar()">REINICIAR</button>
  </div>


  <div class="panel">
    <span>Puntos: <span id="puntos">0</span></span>
    <span>Tiempo: <span id="tiempo">10</span></span>
  </div>

  <p id="mensaje"></p>

  <script src="cazando.js"></script>
</body>
</html>
